<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    La source unique des icônes de l'application. `bun tauri icon
    src-tauri/icons/source.svg` regénère tout ce dossier à partir d'elle ;
    aucun des PNG, ICNS ou ICO voisins ne se retouche à la main.

    Le tracé du profilé vient tel quel de `public/omptcrm.svg`, le fichier
    fourni par l'entreprise — le même que `shared/ui/logo.tsx` et
    `app/icon.svg`. Le redessiner aurait donné une ressemblance, pas le logo.

    Trois choix, et les trois valent pour une icône **posée dans un dock ou une
    barre des tâches**, jamais regardée agrandie :

    - **L'orange remplit la plaque, le profilé est blanc**, comme le favicon et
      la pastille du tiroir. Les trois doivent se ressembler : c'est la même
      marque vue à trois endroits, et un profilé orange sur bleu nuit devient
      une barre sombre sur fond sombre dès qu'on descend sous trente-deux
      pixels.
    - **La plaque occupe 824 des 1024 points, rayon 185.** C'est la grille
      d'Apple pour une icône de macOS : une image carrée pleine cadre se pose
      dans le dock plus grosse que ses voisines et se lit comme un défaut
      d'intégration. Windows admet la même marge sans y perdre — l'inverse ne
      serait pas vrai, d'où une seule source plutôt que deux à tenir d'accord.
    - **Pas de lettre.** « OMPT » à cette taille n'est qu'une bavure de quatre
      traits, et le « O » isolé se lit « D ».

    Les couleurs sont figées : un fichier d'icône ne lit aucune variable CSS,
    et la marque ne change ni avec la palette ni avec le thème.
  -->
  <defs>
    <!--
      Le tracé d'origine laisse un ergot sous l'arête basse, là où le profilé
      rejoint la pointe du M du bloc-marque. Isolé, il se voit ; le découpage
      le coupe, exactement comme dans `app/icon.svg`.
    -->
    <clipPath id="beam">
      <rect x="121" y="322" width="1013" height="171" />
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f06011" />
  <!--
    Le profilé fait 675 points de large, soit 82 % de la plaque — la proportion
    du favicon et de la pastille. Son rapport est de 5,9 pour 1, donc 114 de
    haut, et la translation le centre sur le carré entier : 675/1013 pour
    l'échelle, puis le coin haut-gauche du cadre serré (121, 322) amené en
    (174,5 ; 455).
  -->
  <g transform="translate(93.87 240.44) scale(0.66634)" fill="#ffffff">
    <path
      clip-path="url(#beam)"
      d="M332.85 496.46 l-2.82 -4.16 -103.72 0 c-57.19 0 -103.85 -0.37 -103.85 -0.86 -0.12 -0.61 -0.37 -5.88 -0.61 -11.76 l-0.49 -10.90 29.88 -14.45 30 -14.57 0 -33.55 0 -33.68 -7.72 -3.18 c-4.16 -1.71 -17.51 -7.23 -29.64 -12.25 l-22.04 -9.18 -0.12 -12.86 -0.12 -12.98 505.64 0 505.64 0 -0.37 13.23 -0.37 13.10 -9.18 4.53 c-5.02 2.57 -10.04 4.65 -11.02 4.65 -1.10 0 -2.94 0.73 -4.29 1.59 -1.35 0.98 -7.10 3.43 -12.86 5.51 -5.76 2.08 -12.98 4.90 -16.16 6.37 l-5.88 2.57 0 32.82 0 32.82 29.76 14.57 29.64 14.57 0.37 11.39 0.37 11.27 -101.40 0.12 c-55.72 0.12 -101.89 0 -102.62 -0.24 -0.61 -0.24 -7.59 -0.49 -15.31 -0.37 -7.72 0 -62.33 0 -121.24 0 -341.54 -0.24 -430.21 0 -431.43 1.22 -0.49 0.49 -0.24 1.71 0.61 2.57 2.33 2.82 -0.98 4.04 -10.90 4.04 -4.78 0 -10.16 0.49 -11.76 1.10 -2.69 1.10 -3.43 0.73 -6 -3.06z m675.25 -50.09 l13.23 -6.12 0 -30.86 0 -30.98 -388.45 0.12 c-213.69 0 -390.77 0.37 -393.47 0.86 l-4.90 0.86 -0.37 30.13 -0.24 30 13.72 6.37 13.84 6.37 366.77 -0.37 366.77 -0.24 13.10 -6.12z"
    />
  </g>
</svg>

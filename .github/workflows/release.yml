# Publication d'une version : `scripts/release.sh 0.2.0` pousse l'étiquette
# `v0.2.0`, et ce flux construit, signe et publie les paquets.
#
# Trois temps, et l'ordre est la garantie :
#   1. une release **brouillon** est créée, une seule fois ;
#   2. macOS et Windows s'y déposent en parallèle, avec `latest.json` ;
#   3. seulement si les deux ont réussi, le brouillon est publié.
# L'API relaie la dernière release **publiée** (`/releases/latest` ignore les
# brouillons) : une application ne voit donc jamais une version à moitié
# construite — un Windows proposé sans son macOS, ou l'inverse.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Deux étiquettes poussées ensemble ne publient pas en même temps.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brouillon:
    name: Brouillon de release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # L'étiquette et `package.json` doivent dire la même version : c'est
      # `package.json` que la coque compare à la release pour se mettre à jour.
      - name: L'étiquette correspond à package.json
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Étiquette $GITHUB_REF_NAME, mais package.json dit $expected"
            exit 1
          fi
      # Les notes sont les commits depuis la version précédente. L'API relaie
      # le texte de la release, pas celui de `latest.json` : le réécrire sur la
      # page de la release, même après publication, change ce que l'avis de
      # mise à jour affiche dans l'application.
      - name: Créer le brouillon
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --no-merges --pretty='- %s' "$previous..$GITHUB_REF_NAME" > notes.md
          else
            # Sans étiquette précédente, l'intervalle serait *tout* l'historique
            # — l'interface a été reprise du CRM web avec ses 349 commits, et
            # ce texte est celui que l'application affiche comme notes de mise
            # à jour. On annonce la première version, rien de plus.
            echo "- Première version publiée." > notes.md
          fi
          # **La création rend l'identifiant ; on ne le cherche pas après.**
          # Le premier jet créait le brouillon avec `gh release create` puis le
          # relisait dans la liste des releases — qui ne le rendait pas encore.
          # `tauri-action` recevait un `releaseId` vide, écrivait « skipping all
          # uploads » et **se déclarait en succès** : quinze minutes de
          # construction et de signature pour une release à zéro fichier.
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="OMPT CRM $GITHUB_REF_NAME" \
            -f body="$(cat notes.md)" \
            -F draft=true \
            --jq .id)"
          if [ -z "$id" ]; then
            echo "::error::La création du brouillon n'a rendu aucun identifiant."
            exit 1
          fi
          echo "Brouillon $id pour $GITHUB_REF_NAME"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  paquets:
    name: Paquets ${{ matrix.name }}
    needs: brouillon
    strategy:
      fail-fast: true
      # **Une plateforme à la fois, et ce n'est pas une économie.** Les deux
      # tâches écrivent le *même* `latest.json` : `tauri-action` relit celui que
      # la release porte déjà pour y ajouter sa plateforme, donc deux dépôts
      # simultanés se liraient avant de s'écrire et le second perdrait le
      # premier. La release sortirait avec une seule plateforme — et rien ne le
      # dirait, les clients de l'autre système recevant « rien de neuf » pour
      # toujours. Le temps d'attente double, la facture non : elle se compte en
      # minutes de machine, pas en minutes d'horloge.
      max-parallel: 1
      matrix:
        include:
          # Un seul paquet « universel » pour les deux familles de Mac : un
          # seul téléchargement à donner, et une seule tâche macOS à payer.
          - name: macOS (universel)
            runner: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # `tauri-action` **saute silencieusement tous les dépôts** quand son
      # `releaseId` est vide, et rend la tâche verte. On refuse donc de
      # construire sans lui plutôt que de payer une heure de machine pour rien.
      - name: Le brouillon existe
        run: |
          if [ -z "${{ needs.brouillon.outputs.id }}" ]; then
            echo "::error::Aucun identifiant de brouillon : rien ne serait déposé."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # La clé qui signe les mises à jour. Sa moitié publique est dans
          # tauri.conf.json : la perdre, c'est ne plus jamais pouvoir mettre à
          # jour les applications installées.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.brouillon.outputs.id }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
          retryAttempts: 2

  publier:
    name: Publier
    needs: [brouillon, paquets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Le manifeste décide de tout ce qui suit : c'est lui que l'API relaie, et
      # une plateforme absente est un système entier qui ne se mettra plus
      # jamais à jour, sans message ni erreur. On refuse de publier un
      # brouillon incomplet plutôt que de découvrir le trou à l'usage.
      - name: Le manifeste couvre les deux systèmes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.brouillon.outputs.id }}" \
            --jq '.assets[] | select(.name == "latest.json") | .id')"
          if [ -z "$id" ]; then
            echo "::error::Aucun latest.json dans la release : rien à relayer."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
            -H "Accept: application/octet-stream" > latest.json
          echo "Plateformes : $(jq -r '.platforms | keys | join(", ")' latest.json)"
          for system in darwin windows; do
            if ! jq -e --arg s "$system" '.platforms | keys | any(startswith($s))' latest.json >/dev/null; then
              echo "::error::Le manifeste ne porte aucune plateforme $system."
              exit 1
            fi
          done

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.brouillon.outputs.id }}" \
            -F draft=false -f make_latest=true --jq .html_url

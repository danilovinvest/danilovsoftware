<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon : le profilé du logo OMPT, blanc sur l'orange de la marque.

    Le bloc-marque entier ne tient pas ici — à seize pixels, « OMPT » ne serait
    plus qu'une bavure de quatre traits. Reste le profilé, qui est purement
    géométrique et qu'on reconnaît avant d'avoir lu.

    Trois choix pris en regardant l'icône **à sa taille réelle**, pas agrandie :

    - **L'orange remplit la plaque, le profilé est blanc.** L'inverse — un
      profilé orange sur bleu nuit — donnait une barre fine et sombre sur un
      fond sombre : dans une barre d'onglets, à côté de vingt autres favicons,
      ce n'était plus qu'une tache. C'est la **masse colorée** qui identifie à
      cette taille, et l'orange est la seule des deux couleurs qui ne
      ressemble à aucune autre.
    - **Le profilé occupe 82 % de la largeur**, contre 57 % auparavant : à
      seize pixels, les marges valaient chacune deux pixels de trait perdu.
    - **Pas de lettre.** Le « O » du bloc-marque, isolé, se lit « D » — et un
      logo qui donne l'initiale d'un autre nom que celui de l'enseigne se lit
      comme une erreur, pas comme une signature.

    Les couleurs sont figées : un fichier statique ne lit aucune
    variable CSS, et elles ne changent de toute façon ni avec la palette ni avec le thème.

    Le découpage retire l'ergot que le tracé d'origine laisse sous l'arête
    basse : dans le logo complet il se perd derrière le M, isolé il se voit.
  -->
  <defs>
    <clipPath id="beam">
      <rect x="121" y="322" width="1013" height="171"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#f06011"/>
  <g transform="translate(-0.230,5.460) scale(0.025864)" fill="#ffffff">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon : le profilé du logo OMPT, sur le bleu nuit du lettrage.

    Le bloc-marque entier ne tient pas ici — à seize pixels, « OMPT » ne serait
    plus qu'une bavure de quatre traits. Le profilé, lui, reste lisible : il
    est purement géométrique, et c'est de toute façon lui qu'on reconnaît en
    premier dans une barre d'onglets.

    Les couleurs sont figées : un fichier statique ne lit pas `--logo-*`, et
    elles ne changent de toute façon ni avec la palette ni avec le thème.

    Le découpage retire l'ergot que le tracé d'origine laisse sous l'arête
    basse : dans le logo complet il se perd derrière le M, isolé il se voit.
  -->
  <defs>
    <clipPath id="beam">
      <rect x="121" y="322" width="1013" height="171"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0c253f"/>
